    h(D.ServiceCard, { icon: 'megaphone', category: 'marketing', title: 'Campaigns & ads', description: 'Paid social and search campaigns with clear monthly reporting.', features: ['Strategy and creatives', 'Meta and Google Ads', 'Monthly performance report'], price: { amount: 'DZD 30,000', unit: '/ month' }, action: h(D.Button, { variant: 'secondary', size: 'sm', iconEnd: 'arrow-right' }, 'Details') })
