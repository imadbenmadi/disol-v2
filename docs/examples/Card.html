<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../components/lib/react.production.min.js"></script><script src="../../components/lib/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Card — preview</title></head>
<body>
<div id="root" class="ds-preview-col"></div>
<script>
  var D = window.Disol, h = React.createElement;

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(D.Card, {
      title: 'Client details', subtitle: 'Shown on every invoice for this client.',
      actions: h(D.Button, { variant: 'ghost', size: 'sm' }, 'Edit'),
      footer: [h(D.Button, { key: 1, variant: 'secondary' }, 'Cancel'), h(D.Button, { key: 2 }, 'Save changes')]
    },
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 } },
        h(D.TextField, { label: 'Company', defaultValue: 'Skate Academy' }),
        h(D.TextField, { label: 'Tax ID (NIF)', defaultValue: '000116001234567' })))
  ));
</script>
</body>
</html>
