<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../components/lib/react.production.min.js"></script><script src="../../components/lib/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>ChoiceGroup — preview</title></head>
<body>
<div id="root" class="ds-preview-col"></div>
<script>
  var D = window.Disol, h = React.createElement;
  function Demo() {
    var _s = React.useState(['web', 'cloud']);
    return h(D.ChoiceGroup, {
      label: 'What do you need?', multiple: true, value: _s[0], onChange: _s[1], columns: 4,
      options: [
        { value: 'web', label: 'Website', description: 'Corporate site, landing page, e-commerce', icon: 'globe' },
        { value: 'app', label: 'Mobile app', description: 'iOS and Android', icon: 'smartphone' },
        { value: 'erp', label: 'ERP / platform', description: 'Custom business software', icon: 'layers' },
        { value: 'cloud', label: 'Cloud & hosting', description: 'Servers, domains, email', icon: 'cloud' }
      ]
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
