<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../components/lib/react.production.min.js"></script><script src="../../components/lib/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="ds-preview"></div>
<script>
  var D = window.Disol, h = React.createElement;

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(D.Button, { icon: 'plus' }, 'Create invoice'),
    h(D.Button, { variant: 'secondary', icon: 'download' }, 'Export'),
    h(D.Button, { variant: 'ghost' }, 'Cancel'),
    h(D.Button, { variant: 'danger' }, 'Delete client'),
    h(D.Button, { loading: true }, 'Saving'),
    h(D.Button, { variant: 'secondary', size: 'sm' }, 'Filter'),
    h(D.Button, { variant: 'ghost', size: 'sm', icon: 'more', 'aria-label': 'More actions' }),
    h(D.Button, { size: 'lg' }, 'Request a service'),
    h(D.Button, { disabled: true }, 'Disabled')
  ));
</script>
</body>
</html>
