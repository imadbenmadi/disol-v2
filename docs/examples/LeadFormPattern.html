<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../components/lib/react.production.min.js"></script><script src="../../components/lib/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>LeadFormPattern — preview</title></head>
<body>
<div id="root" class="ds-preview-col"></div>
<script>
  var D = window.Disol, h = React.createElement;
  function Demo() {
    var _step = React.useState(0), step = _step[0], setStep = _step[1];
    var _svc = React.useState(['web']);
    var steps = ['Service', 'Project', 'Contact'];
    var body = step === 0
      ? h(D.ChoiceGroup, { label: 'What do you need?', multiple: true, value: _svc[0], onChange: _svc[1], columns: 2, options: [
          { value: 'web', label: 'Website', description: 'Site, landing page, e-commerce', icon: 'globe' },
          { value: 'app', label: 'Mobile app', description: 'iOS and Android', icon: 'smartphone' },
          { value: 'cloud', label: 'Cloud & hosting', description: 'Servers, domains, email', icon: 'cloud' },
          { value: 'marketing', label: 'Marketing', description: 'Ads, content, social', icon: 'megaphone' }] })
      : step === 1
      ? h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 } },
          h(D.Select, { label: 'Budget', placeholder: 'Choose a range', options: ['Under DZD 100k', 'DZD 100k–500k', 'DZD 500k–2M', 'Over DZD 2M'] }),
          h(D.Select, { label: 'Timeline', placeholder: 'When do you need it?', options: ['This month', '1–3 months', '3–6 months', 'Just exploring'] }),
          h('div', { style: { gridColumn: '1 / -1' } }, h(D.Textarea, { label: 'Tell us about your project', placeholder: 'e.g. A bilingual site for our clinic with online booking.' })))
      : h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 } },
          h(D.TextField, { label: 'Full name', required: true, autoComplete: 'name' }),
          h(D.TextField, { label: 'Company', autoComplete: 'organization' }),
          h(D.TextField, { label: 'Email', type: 'email', required: true, autoComplete: 'email' }),
          h(D.TextField, { label: 'Phone', type: 'tel', placeholder: '+213', autoComplete: 'tel' }),
          h('div', { style: { gridColumn: '1 / -1' } }, h(D.Checkbox, { label: 'I agree to be contacted about this request.' })));
    return h('div', { style: { maxWidth: 720, margin: '0 auto' } },
      h(D.Card, {
        footer: [step > 0 && h(D.Button, { key: 'b', variant: 'ghost', onClick: function () { setStep(step - 1); } }, 'Back'),
                 h(D.Button, { key: 'n', iconEnd: step < 2 ? 'arrow-right' : null, onClick: function () { setStep(Math.min(2, step + 1)); } }, step < 2 ? 'Continue' : 'Send request')]
      },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 24 } },
          h(D.Stepper, { steps: steps, current: step }),
          body)));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
