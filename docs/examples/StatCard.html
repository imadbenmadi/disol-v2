<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><script src="../../components/lib/react.production.min.js"></script><script src="../../components/lib/react-dom.production.min.js"></script><script src="../../components/bundle.js"></script><meta charset="utf-8"><title>StatCard — preview</title></head>
<body>
<div id="root" class="ds-preview" style="display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;"></div>
<script>
  var D = window.Disol, h = React.createElement;

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(D.StatCard, { label: 'Revenue this month', value: 'DZD 1,240,000', delta: '+12.4%', caption: 'vs September', icon: 'wallet' }),
    h(D.StatCard, { label: 'Open projects', value: '18', delta: '+3', caption: 'vs September', icon: 'briefcase' }),
    h(D.StatCard, { label: 'Overdue invoices', value: '4', delta: '-2', intent: 'positive', caption: 'vs September', icon: 'file-text' })
  ));
</script>
</body>
</html>
